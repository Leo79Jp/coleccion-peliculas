<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Películas</title>
    <style>
body { 
    font-family: Arial, sans-serif; 
    padding: 20px; 
    max-width: 500px; 
    margin: auto; 
    
    /* Imagen que enviaste con un filtro oscuro encima para resaltar los textos */
    background-image: linear-gradient(rgba(15, 15, 26, 0.88), rgba(15, 15, 26, 0.94)), url('https://plus.unsplash.com/premium_photo-1765475030994-362a9037f20f?mark=https%3A%2F%2Fimages.unsplash.com%2Fopengraph%2Flogo.png&mark-w=64&mark-align=top%2Cleft&mark-pad=50&h=630&w=1200&crop=faces%2Cedges&blend-w=1&blend=000000&blend-mode=normal&blend-alpha=10&auto=format&fit=crop&q=60&ixid=M3wxMjA3fDB8MXxhbGx8fHx8fHx8fHwxNzgwNzI4NDQyfA&ixlib=rb-4.1.0');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
}

h1 { 
    text-align: center; 
    color: #ffffff; 
    margin-bottom: 5px; 
    text-shadow: 0 2px 4px rgba(0,0,0,0.8); 
}

.contador { 
    text-align: center; 
    color: #b3b3b3; 
    font-size: 14px; 
    margin-bottom: 20px; 
}

.control-busqueda { 
    display: flex; 
    gap: 10px; 
    margin-bottom: 20px; 
}

input { 
    flex: 1; 
    padding: 12px; 
    font-size: 16px; 
    border: 1px solid #444; 
    border-radius: 8px; 
    box-sizing: border-box; 
    background-color: rgba(255, 255, 255, 0.9); /* Input claro para escribir cómodamente */
    color: #000;
}

button { 
    padding: 12px 16px; 
    font-size: 16px; 
    background-color: #dc3545; 
    color: white; 
    border: none; 
    border-radius: 8px; 
    cursor: pointer; 
    font-weight: bold; 
}

button:active { 
    background-color: #bd2130; 
}

/* Tarjetas de las películas modificadas con fondo blanco traslúcido para legibilidad perfecta */
.pelicula { 
    background: rgba(255, 255, 255, 0.95); 
    padding: 15px; 
    margin-bottom: 10px; 
    border-radius: 8px; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
}

.titulo { 
    font-weight: bold; 
    font-size: 16px; 
    color: #111; /* Texto oscuro sobre la tarjeta clara */
    padding-right: 10px; 
}

.ubicacion { 
    background: #007BFF; 
    color: white; 
    padding: 6px 12px; 
    border-radius: 20px; 
    font-size: 14px; 
    font-weight: bold; 
    white-space: nowrap; 
}

    </style>
</head>
<body>

    <h1>Mis Películas 🎬</h1>
    <div class="contador" id="total-peliculas">Cargando películas...</div>
    
    <div class="control-busqueda">
        <input type="text" id="buscador" placeholder="Escribe el nombre de la película...">
        <button id="btn-limpiar">✕</button>
    </div>

    <div id="resultados"></div>

    <script src="app.js"></script>
</body>
</html>
